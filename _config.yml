title: Kristjan Kongas
tagline: Tools for machine learning and C++
description: >-
  Projects and writing by Kristjan Kongas — NaNsense, an interactive PyTorch
  debugger; fire-hpp, a header-only C++ CLI library; and experiments in
  reinforcement learning and physics simulation.
author: Kristjan Kongas
url: https://kongaskristjan.github.io
baseurl: ""
github_username: kongaskristjan
lang: en

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

twitter:
  card: summary_large_image

defaults:
  - scope:
      path: ""
    values:
      image: /assets/media/og-card.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .idea
  - .bundle
