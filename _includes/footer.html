<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <div class="site-footer__brand">
      <p class="site-footer__name">{{ site.title }}</p>
      <p class="site-footer__tagline">{{ site.tagline }}</p>
    </div>

    <nav class="site-footer__links" aria-label="Footer">
      <a href="https://github.com/{{ site.github_username }}" rel="me noopener">GitHub</a>
      <a href="https://github.com/kongaskristjan/nansense" rel="noopener">NaNsense</a>
      <a href="https://github.com/kongaskristjan/fire-hpp" rel="noopener">fire-hpp</a>
      <a href="https://github.com/kongaskristjan/stable-entropy" rel="noopener">stable-entropy</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
  </div>

  <div class="wrap site-footer__meta">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.author }}</p>
    <p>Built with <a href="https://jekyllrb.com" rel="noopener">Jekyll</a>, hosted on GitHub Pages</p>
  </div>
</footer>
